[project]
name = "ai-market-workbench"
version = "0.1.0"
description = "Read-only, evidence-first market analysis vertical slice"
requires-python = ">=3.12,<3.13"
dependencies = [
  "exchange-calendars==4.13.2",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema[format-nongpl]==4.26.0",
  "mcp==2.1.1",
  "openapi-spec-validator==0.9.0",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
  "pip-audit==2.10.1",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".pytest_cache_local"

